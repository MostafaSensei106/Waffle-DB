[package]
name = "waffle_db"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
flutter_rust_bridge = "=2.13.0"
serde = { version = "1.0.229", features = ["derive"] }
rkyv = { version = "0.8.18", features = ["bytecheck"] }
rayon = "1.12.0"
num_cpus = "1.17.0"
serde_json = "1.0.154"
anyhow = "1.0.104"
cxx = "1.0"

usearch = { version = "2", default-features = true }
# Text Engine: BM25 inverted index + tokenization/stemming (EN + AR via rust-stemmers).
tantivy = "0.26"
# Storage Engine: ACID + MVCC (MRSW reads during writes). Pinned to v2 for edition 2021.
redb = "2"
# Filter Engine: compressed u32 bitmaps persisted through redb.
roaring = { version = "0.11", features = ["serde"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }


[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
