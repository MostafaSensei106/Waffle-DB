[package]
name = "waffle_db"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
flutter_rust_bridge = "=2.13.0"
sled = { version = "0.34.7" }
serde = { version = "1.0.229", features = ["derive"] }
rkyv = { version = "0.8.18", features = ["bytecheck"] }
rayon = "1.12.0"
num_cpus = "1.17.0"
hnsw_rs = "0.3.5"
rand = "0.8.8"
serde_json = "1.0.154"
getrandom = { version = "0.3", features = ["wasm_js"] }
getrandom_0_2 = { package = "getrandom", version = "0.2", features = ["js"] }
anyhow = "1.0.104"
thiserror = "2"

# --- Enterprise RAG engines (usearch + tantivy + redb + roaring) ---
# Vector Engine: SIMD K-NN + predicate pre-filtering during traversal.
usearch = "2"
# Text Engine: BM25 inverted index + tokenization/stemming (EN + AR via rust-stemmers).
tantivy = "0.26"
# Storage Engine: ACID + MVCC (MRSW reads during writes). Pinned to v2 for edition 2021.
redb = "2"
# Filter Engine: compressed u32 bitmaps; serde for redb persistence, simd for fast builds.
roaring = { version = "0.11", features = ["serde", "simd"] }
# Background ingestion queue: MPSC worker so Flutter UI never blocks on writes.
crossbeam-channel = "0.5"

[dev-dependencies]
criterion = "0.5.1"
rand = "0.8.8"


[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }


[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
