name: waffle_db
description: "An advanced, local vector database for Flutter, powered by Rust and HNSW graph indexing."

version: 0.0.2+1

repository: https://github.com/MostafaSensei106/Waffle-DB
issue_tracker: https://github.com/flutter/flutter/issues

license: GPL-version 3.0

topics:
- ffi
- vector
- ai
- database
- rust

funding:
- https://github.com/sponsors/MostafaSensei106
- https://buymeacoffee.com/7yz1lqkegy
- https://ipn.eg/S/mostafasensei106/instapay/0dlUfz

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter_rust_bridge: ^2.13.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  ffi: ^2.1.3
  ffigen: ^21.0.0
  flutter_lints: ^6.0.0
  benchmark_harness: ^2.4.0

flutter:
  plugin:
    platforms:
      android:
        ffiPlugin: true
      ios:
        ffiPlugin: true
      linux:
        ffiPlugin: true
      macos:
        ffiPlugin: true
      windows:
        ffiPlugin: true
